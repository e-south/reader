name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --group dev

      - name: Lockfile drift check
        run: uv lock --check

      - name: Audit published runtime dependencies
        run: |
          mkdir -p .artifacts
          uv export --locked --no-dev --no-emit-project \
            --format requirements-txt \
            --output-file .artifacts/runtime-requirements.txt
          uv run --locked pip-audit \
            --requirement .artifacts/runtime-requirements.txt \
            --no-deps \
            --disable-pip

      - name: Docs integrity
        run: uv run --locked reader maintain docs

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Compile source
        run: uv run --locked python -m compileall src/reader

      - name: Build (sdist + wheel)
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uv run --locked twine check dist/*

  default-tests:
    name: Default Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --group dev --group notebooks

      - name: Run default test lane with coverage
        run: |
          mkdir -p .artifacts
          uv run --locked pytest -q \
            --cov=reader \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:.artifacts/coverage.xml \
            --junitxml=.artifacts/pytest-default.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: default-test-artifacts
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error

  coverage-upload:
    name: Coverage Upload
    needs: [default-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: default-test-artifacts
          path: .artifacts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: .artifacts/coverage.xml
          flags: default
          name: default-suite
          fail_ci_if_error: false
          verbose: true

  lint-test-build:
    name: lint-test-build
    runs-on: ubuntu-latest
    needs: [quality, default-tests, coverage-upload]
    if: always()

    steps:
      - name: Aggregate required checks
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "default-tests=${{ needs.default-tests.result }}"
          echo "coverage-upload=${{ needs.coverage-upload.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.default-tests.result }}" = "success"
          test "${{ needs.coverage-upload.result }}" = "success" -o "${{ needs.coverage-upload.result }}" = "skipped"
