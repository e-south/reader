name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Verify release version
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${project_version}"
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Verify successful main checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/release-evidence
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yaml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=100 \
            > .tmp/release-checks.json
          python src/reader_workbench/maintenance/release.py \
            --checks .tmp/release-checks.json --revision "$GITHUB_SHA" \
            > .tmp/release-evidence/checks.json
      - name: Verify lockfile
        run: uv lock --check
      - name: Verify immutable package-page banner
        run: |
          python - <<'PYBANNER'
          import pathlib, re, tomllib, urllib.request
          root = pathlib.Path('.')
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          url = re.findall(r'!\[[^\]]*\]\(([^)]+)\)', (root / 'README.md').read_text())[0]
          expected = f"https://raw.githubusercontent.com/e-south/reader/v{project['version']}/assets/reader-banner.png"
          assert url == expected, 'Banner must be bound to the released version'
          with urllib.request.urlopen(url, timeout=30) as response:
              published = response.read(10_000_001)
          assert published == (root / 'assets/reader-banner.png').read_bytes(), 'Published banner differs from source'
          assert len(published) < 10_000_000 and published.startswith(b'\x89PNG\r\n\x1a\n')
          PYBANNER
      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python - <<'PY'
          import pathlib, tomllib
          requirements = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['build-system']['requires']
          pathlib.Path('.tmp/release-evidence/build-requirements.in').write_text('\n'.join(requirements) + '\n')
          PY
          uv pip compile .tmp/release-evidence/build-requirements.in --generate-hashes \
            -o .tmp/release-evidence/build-requirements.lock
          uv build --no-sources --build-constraints .tmp/release-evidence/build-requirements.lock
      - name: Smoke-test built wheel
        run: |
          python -m venv .tmp/wheel-smoke
          .tmp/wheel-smoke/bin/python -m pip install dist/*.whl
          .tmp/wheel-smoke/bin/python -m pip check
          .tmp/wheel-smoke/bin/python -c 'import importlib.util; import reader_workbench; assert importlib.util.find_spec("reader") is None'
          .tmp/wheel-smoke/bin/reader --version
          .tmp/wheel-smoke/bin/reader plugins --format json > /dev/null
          .tmp/wheel-smoke/bin/reader protocols --format json > /dev/null
      - name: Verify distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*
      - name: Retain release evidence
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, tomllib
          root = pathlib.Path('.')
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          evidence = root / '.tmp/release-evidence'
          citation = (root / 'CITATION.cff').read_text()
          (evidence / 'CITATION.cff').write_text(citation + f'version: "{project["version"]}"\n')
          record = {
              'name': project['name'], 'version': project['version'],
              'revision': os.environ['GITHUB_SHA'], 'tag': os.environ['GITHUB_REF_NAME'],
              'python': platform.python_version(), 'uv_lock_sha256': sha(root / 'uv.lock'),
              'readme_sha256': sha(root / 'README.md'), 'banner_sha256': sha(root / 'assets/reader-banner.png'),
              'uv': subprocess.check_output(['uv', '--version'], text=True).strip(),
              'build_lock_sha256': sha(evidence / 'build-requirements.lock'),
              'checks': json.loads((evidence / 'checks.json').read_text()),
              'artifacts': {p.name: sha(p) for p in sorted((root / 'dist').glob('*'))
                            if p.name.endswith(('.whl', '.tar.gz'))},
          }
          (evidence / 'provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          path: .tmp/release-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/reader-workbench
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
