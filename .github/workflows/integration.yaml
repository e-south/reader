name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --group dev

      - name: Run integration suite
        run: |
          mkdir -p .artifacts
          uv run --locked pytest -q \
            -o addopts='--strict-config --strict-markers -ra' \
            -m integration \
            --durations=25 \
            --junitxml=.artifacts/pytest-integration.xml

      - name: Capture experiment readiness inventory
        if: always()
        run: |
          uv run reader ls --root experiments --details --readiness --limit 100 --format json > .artifacts/readiness.json
          uv run python -c "import json, pathlib; payload=json.loads(pathlib.Path('.artifacts/readiness.json').read_text()); assert not payload['meta']['truncated'], 'readiness inventory exceeded the explicit 100-experiment CI bound'"

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
