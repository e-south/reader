name: Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          save-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Audit operational dependencies
        run: |
          mkdir -p .artifacts
          uv export --locked --no-dev --no-emit-project \
            --format requirements-txt \
            --output-file .artifacts/operational-requirements.txt
          uv run --locked pip-audit \
            --requirement .artifacts/operational-requirements.txt \
            --no-deps \
            --disable-pip
      - name: Verify documentation
        run: uv run --locked reader maintain docs
      - name: Verify agent skills
        run: uv run --locked reader maintain skills
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Compile source
        run: test -d src/reader_workbench && uv run --locked python -m compileall -q src/reader_workbench
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke-test built wheel
        run: |
          python -m venv .tmp/wheel-smoke
          .tmp/wheel-smoke/bin/python -m pip install dist/*.whl
          .tmp/wheel-smoke/bin/python -m pip check
          .tmp/wheel-smoke/bin/python -c 'import importlib.util; import reader_workbench; assert importlib.util.find_spec("reader") is None'
          .tmp/wheel-smoke/bin/reader --version
          .tmp/wheel-smoke/bin/reader plugins --format json > /dev/null
          .tmp/wheel-smoke/bin/reader protocols --format json > /dev/null
      - name: Verify distribution metadata
        run: uv run --locked twine check dist/*

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: |
          mkdir -p .artifacts
          uv run --locked pytest -q \
            --cov=reader_workbench \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:.artifacts/coverage.xml \
            --junitxml=.artifacts/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  cli-compatibility:
    name: CLI dependency bounds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          save-cache: false
      - name: Smoke-test minimum supported Typer
        run: >-
          uv run --isolated --no-dev --with-editable .
          --with 'typer==0.16.0' --with 'click==8.3.3' --with 'pytest>=8.2'
          pytest -q src/reader_workbench/tests/cli/test_json_automation.py -k main_cli_framework
      - name: Smoke-test latest compatible CLI dependencies
        run: >-
          uv run --isolated --no-dev --with-editable .
          --upgrade-package typer --upgrade-package click --with 'pytest>=8.2'
          pytest -q src/reader_workbench/tests/cli/test_json_automation.py -k main_cli_framework

  coverage:
    name: Coverage
    needs: [tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-results
          path: .artifacts
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: .artifacts/coverage.xml
          flags: default
          name: default-suite
          fail_ci_if_error: true

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: [package, tests, cli-compatibility, coverage]
    if: always()
    steps:
      - name: Require successful jobs
        run: |
          test "${{ needs.package.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.cli-compatibility.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success" -o "${{ needs.coverage.result }}" = "skipped"
