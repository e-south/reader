<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Reader experimental-data workbench</title>
  <desc>A minimal lo-fi pipeline for ingesting, transforming, plotting, and tracing experimental data.</desc>

  <rect width="1280" height="260" fill="#F3EFE7"/>
  <rect x="8" y="8" width="1264" height="244" stroke="#1E1D1A" stroke-width="4"/>
  <rect x="8" y="8" width="20" height="20" fill="#D97757"/>

