<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Reader experimental-data workbench</title>
  <desc>A dark, quiet lo-fi path from ingest through transformation and plotting to traceable experiment outputs.</desc>

  <rect width="1280" height="260" fill="#1E1D1A"/>

  <g font-family="Menlo, Monaco, Consolas, monospace">
    <text x="52" y="58" fill="#969087" font-size="12" letter-spacing="1.4">EXPERIMENTAL DATA WORKBENCH</text>
    <text x="48" y="151" fill="#F3EFE7" font-size="72" font-weight="700" letter-spacing="-2">reader</text>
    <rect x="52" y="177" width="40" height="6" fill="#D97757"/>
  </g>

  <path d="M432 46V214" stroke="#3F3C37" stroke-width="2"/>
  <path d="M520 132H1192" stroke="#5A5650" stroke-width="2"/>

  <g font-family="Menlo, Monaco, Consolas, monospace">
    <g transform="translate(520 0)">
      <rect x="0" y="82" width="54" height="6" fill="#F3EFE7"/>
      <rect x="0" y="96" width="38" height="6" fill="#969087"/>
      <rect x="0" y="110" width="46" height="6" fill="#5A5650"/>
      <text x="0" y="174" fill="#F3EFE7" font-size="12" font-weight="700" letter-spacing="0.6">INGEST</text>
    </g>

    <g transform="translate(696 0)">
      <rect x="0" y="91" width="18" height="18" fill="#F3EFE7"/>
      <rect x="28" y="91" width="18" height="18" fill="#D97757"/>
      <rect x="56" y="91" width="18" height="18" fill="#F3EFE7"/>
      <text x="0" y="174" fill="#F3EFE7" font-size="12" font-weight="700" letter-spacing="0.6">TRANSFORM</text>
    </g>

    <g transform="translate(890 0)">
      <rect x="0" y="103" width="12" height="13" fill="#969087"/>
      <rect x="22" y="91" width="12" height="25" fill="#F3EFE7"/>
      <rect x="44" y="75" width="12" height="41" fill="#D97757"/>
      <text x="0" y="174" fill="#F3EFE7" font-size="12" font-weight="700" letter-spacing="0.6">PLOT</text>
    </g>

    <g transform="translate(1064 0)">
      <rect x="0" y="82" width="8" height="8" fill="#D97757"/>
      <rect x="18" y="83" width="52" height="6" fill="#F3EFE7"/>
      <rect x="0" y="98" width="8" height="8" fill="#F3EFE7"/>
      <rect x="18" y="99" width="38" height="6" fill="#969087"/>
      <rect x="0" y="114" width="8" height="8" fill="#F3EFE7"/>
      <rect x="18" y="115" width="46" height="6" fill="#5A5650"/>
      <text x="0" y="174" fill="#F3EFE7" font-size="12" font-weight="700" letter-spacing="0.6">TRACE</text>
    </g>
  </g>
</svg>
