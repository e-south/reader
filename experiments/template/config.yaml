schema: reader/v4
experiment:
  title: biosensor_panel_M9_glu
resources:
  sample_map:
    kind: file
    path: ./inputs/metadata.xlsx
pipeline:
  runtime:
    strict: true
  steps:
  - id: ingest
    plugin: ingest/synergy_h1
    with:
      mode: mixed
      channels:
      - OD600
      - CFP
      - YFP
      add_sheet: true
    writes:
      df:
        record: raw/df
  - id: merge_map
    plugin: transform/sample_map
    reads:
      df:
        record: raw/df
      sample_map:
        resource: sample_map
    writes:
      df:
        record: merged/df
  - id: ratio_yfp_cfp
    plugin: transform/ratio
    reads:
      df:
        record: merged/df
    with:
      name: YFP/CFP
      numerator: YFP
      denominator: CFP
    writes:
      df:
        record: ratio_yfp_cfp/df
  - id: ratio_yfp_od600
    plugin: transform/ratio
    reads:
      df:
        record: ratio_yfp_cfp/df
    with:
      name: YFP/OD600
      numerator: YFP
      denominator: OD600
    writes:
      df:
        record: ratio_yfp_od600/df
  - id: blank
    plugin: transform/blank_correction
    reads:
      df:
        record: ratio_yfp_od600/df
    with:
      method: subtract
      capture_blanks: true
    writes:
      df:
        record: corrected/df
      blanks:
        record: corrected/blanks
  - id: overflow
    plugin: transform/overflow_handling
    reads:
      df:
        record: corrected/df
    with:
      action: max
      clip_quantile: 0.999
    writes:
      df:
        record: final/df
  - id: sfxi
    plugin: transform/sfxi
    reads:
      df:
        record: final/df
    with:
      response:
        logic_channel: YFP/CFP
        intensity_channel: YFP/OD600
      design_by:
      - design_id
      time_mode: nearest
      target_time_h: 10
      time_tolerance_h: 0.5
      reference:
        design_id: REF
        stat: mean
      logic_map_ref: induction_logic
    writes:
      vec8:
        record: sfxi/vec8
plots:
  defaults:
    reads:
      df:
        record: final/df
  specs:
  - id: plot_ts
    plugin: plot/time_series
    reads:
      blanks:
        record: corrected/blanks
    with:
      x: time
      y:
      - OD600
      - CFP
      - YFP
      hue: treatment
      partition:
        collection_ref: group_ab
      fig:
        rc:
          savefig_dpi: 300
  - id: logic
    plugin: plot/logic_symmetry
    with:
      response_channel: YFP/CFP
      design_by:
      - design_id
      batch_col: batch
      aggregation:
        replicate_stat: mean
        uncertainty: halo
      encodings:
        size_by: log_r
        hue: null
        alpha_by: batch
      output:
        format:
        - pdf
        dpi: 300
        figsize:
        - 7
        - 6
      logic_map_ref: induction_logic
exports:
  defaults:
    reads:
      df:
        record: final/df
  specs:
  - id: export_final
    plugin: export/csv
    with:
      path: final.csv
notebooks:
  specs:
  - id: default
    template: notebook/eda
assay:
  collections:
    group_ab:
      column: design_id
      items:
        Group A:
        - g1
        - g2
        Group B:
        - g3
  orders:
    induction_stress_2x2:
      column: treatment
      values:
      - -IPTG/-stress
      - +IPTG/-stress
      - -IPTG/+stress
      - +IPTG/+stress
  logic_maps:
    induction_logic:
      column: treatment
      corners:
        '00': …
        '10': …
        '01': …
        '11': …
      case_sensitive: true
