schema: reader/v7
experiment:
  id: template
  title: biosensor_panel_M9_glu
protocol:
  id: logic/sfxi_screen
  inputs:
    ingest:
      mode: mixed
      channels:
      - OD600
      - CFP
      - YFP
      add_sheet: true
    response:
      logic_channel: YFP/CFP
      intensity_channel: YFP/OD600
    reference:
      design_id: REF
      stat: mean
    design_by:
    - design_id
    logic_map_ref: induction_logic
    target_time_h: 10
    time_mode: nearest
    time_tolerance_h: 0.5
  analysis:
    include_fold_change: false
    include_export: false
    preprocessing:
      blank:
        method: subtract
        capture_blanks: true
      overflow:
        action: max
        clip_quantile: 0.999
  outputs:
    plots:
      profile: none
      views:
        raw_kinetics:
          x: time
          y:
          - OD600
          - CFP
          - YFP
          hue: treatment
          partition:
            collection_ref: group_ab
          fig:
            rc:
              savefig_dpi: 300
        logic_symmetry:
          response_channel: YFP/CFP
          design_by:
          - design_id
          batch_col: batch
          aggregation:
            replicate_stat: mean
            uncertainty: halo
          encodings:
            size_by: log_r
            alpha_by: batch
          output:
            format:
            - pdf
            dpi: 300
            figsize:
            - 7
            - 6
          logic_map_ref: induction_logic
      include:
      - raw_kinetics
      - logic_symmetry
    notebook:
      template: notebook/eda
resources:
  sample_map:
    kind: file
    path: ./inputs/metadata.xlsx
annotations:
  collections:
    group_ab:
      column: design_id
      items:
        Group A:
        - g1
        - g2
        Group B:
        - g3
  orders:
    induction_stress_2x2:
      column: treatment
      values:
      - -IPTG/-stress
      - +IPTG/-stress
      - -IPTG/+stress
      - +IPTG/+stress
  logic_maps:
    induction_logic:
      column: treatment
      corners:
        '00': …
        '10': …
        '01': …
        '11': …
      case_sensitive: true
