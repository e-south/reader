schema: reader/v8
experiment:
  id: template
  title: synthetic_logic_panel
  lifecycle: template
protocol:
  id: logic/sfxi_screen
  inputs:
    ingest:
      mode: mixed
      channel_map:
        "OD600:600": OD600
        "CFP:433,475": CFP
        "YFP:500,530": YFP
      auto_pick: single
    reference:
      design_id: REF
      observation_stat: mean
    design_by:
    - design_id
    state_map_ref: logic_states
    target_time_h: 10
    time_mode: nearest
    time_tolerance_h: 0.5
  analysis:
    include_fold_change: false
    include_export: false
    logic_symmetry:
      batch_col: batch
      observation_stat: mean
    preprocessing:
      blank:
        method: subtract
        capture_blanks: true
      overflow:
        action: max
        clip_quantile: 0.999
  outputs:
    plots:
      profile: none
      views:
        raw_kinetics:
          x: time
          y:
          - OD600
          - CFP
          - YFP
          hue: treatment
          partition:
            collection_ref: group_ab
          fig:
            rc:
              savefig_dpi: 300
        logic_symmetry:
          dispersion: halo
          encodings:
            size_by: log_r
            alpha_by: batch
          format:
          - pdf
          dpi: 300
          figsize:
          - 7
          - 6
      include:
      - raw_kinetics
      - logic_symmetry
resources:
  sample_map:
    kind: file
    path: ./inputs/metadata.csv
annotations:
  collections:
    group_ab:
      column: design_id
      items:
        Group A:
        - g1
        - g2
        Group B:
        - g3
  orders:
    binary_input_states:
      column: treatment
      values:
      - -input-a/-input-b
      - +input-a/-input-b
      - -input-a/+input-b
      - +input-a/+input-b
  ordered_state_spaces:
    logic_states:
      column: treatment
      state_order:
      - '00'
      - '10'
      - '01'
      - '11'
      values:
        '00': -input-a/-input-b
        '10': +input-a/-input-b
        '01': -input-a/+input-b
        '11': +input-a/+input-b
      case_sensitive: true
